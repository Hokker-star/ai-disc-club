>div:before{content:"";position:absolute;left:-1px;top:7px;width:9px;height:9px;background:#fff;border:2px solid #54595d;border-radius:50%;transform:translateX(-50%)}.time b{font-size:18px}.time p{margin:4px 0 0}.process{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:stretch;margin:24px 0;min-width:760px}.process>div{border:1px solid var(--line);padding:14px;background:#f8f9fa}.process>span{align-self:center;font-size:24px;color:var(--muted)}.process p{font-size:15px;margin:5px 0 0}.article .process-scroll{overflow-x:auto}.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:24px 0}.stat-grid div{background:#fff;padding:18px}.stat-grid strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:500}.stat-grid span{font-size:15px;color:var(--muted)}table{border-collapse:collapse;width:100%;margin:18px 0 24px;font-size:15px;line-height:1.5}th,td{border:1px solid var(--line);padding:10px 11px;text-align:left;vertical-align:top}th{background:#f8f9fa;font-weight:650}.table-scroll{overflow-x:auto}.balance,.compare-use{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.balance>div,.compare-use>div{border-top:3px solid #a2a9b1;padding:12px 2px}.balance b,.compare-use b{font-size:18px}.bar-chart{border-top:1px solid var(--soft);border-bottom:1px solid var(--soft);padding:15px 0;margin:20px 0}.bar-row{display:grid;grid-template-columns:minmax(230px,1.4fr) 1fr 48px;gap:10px;align-items:center;margin:12px 0;font-size:14px}.bar-row i{height:14px;background:#eaecf0;display:block}.bar-row i b{height:100%;background:#72777d;display:block}.bar-row em{font-style:normal;font-weight:700;text-align:right}.related{margin-top:50px;padding-top:4px;border-top:1px solid #a2a9b1}.related h2{border:0;margin:20px 0 6px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:18px;font-weight:700}.rel <script>
const pages = [{"id": "home", "section": "Введение", "title": "Искусственный интеллект: что он нам даёт, что забирает и почему спор только начинается", "keywords": ["ИИ", "искусственный интеллект", "дискуссия", "обзор", "главный тезис"], "html": "\n<p class=\"lead\">ИИ — не магический «электронный разум» и не просто очередная программа. Нынешняя волна впервые массово автоматизирует не только физические или рутинные операции, но и куски интеллектуальной работы: письмо, анализ, программирование, поиск вариантов, перевод, создание изображений и обучение.</p>\n<div class=\"callout key\"><strong>Главный тезис</strong><p>ИИ действительно способен резко повышать производительность, но эффект очень неровный. Он может сделать человека быстрее и сильнее на одной задаче — и одновременно хуже обучить его, ввести в заблуждение или даже замедлить на соседней.</p></div>\n<p>Поэтому полезнее спрашивать не «ИИ — хорошо или плохо?», а <strong>какие функции мы готовы ему отдавать, какие должны оставить себе и кто отвечает, когда машина уверенно делает глупость</strong>.</p>\n<p>Материал опирается прежде всего на исследования OECD, ILO, Stanford HAI, Pew Research Center, Eurostat, Европейской комиссии, PNAS, Science / Scientific Reports, ACM и полевые эксперименты. Состояние данных — <strong>12 сентября 2026 года</strong>.</p>\n<h2>Как читать эту базу</h2>\n<p>Начать лучше с <a href=\"#what-is-ai\" data-wiki=\"what-is-ai\">определения ИИ</a>, затем перейти к <a href=\"#history-revolutions\" data-wiki=\"history-revolutions\">историческим аналогиям</a> и <a href=\"#productivity\" data-wiki=\"productivity\">экспериментам с производительностью</a>. Если интересует главный нерв спора — сразу открывайте <a href=\"#learning\" data-wiki=\"learning\">обучение и «отупение»</a>, <a href=\"#work\" data-wiki=\"work\">рынок труда</a> или <a href=\"#ethics\" data-wiki=\"ethics\">ответственность и этику</a>.</p>\n<div class=\"map-list\">\n<a href=\"#what-is-ai\" data-wiki=\"what-is-ai\"><b>Что такое ИИ</b><span>Определение без разговоров про сознание и «электронную личность».</span></a>\n<a href=\"#history-revolutions\" data-wiki=\"history-revolutions\"><b>Почему эта революция знакомая</b><span>Письменность, печать, луддиты — и почему аналогии нельзя превращать в индульгенцию.</span></a>\n<a href=\"#productivity\" data-wiki=\"productivity\"><b>Где ИИ реально помогает</b><span>Эксперименты с письмом, контакт-центрами и консультантами.</span></a>\n<a href=\"#errors-limits\" data-wiki=\"errors-limits\"><b>Где ломается</b><span>«Зубчатая граница», галлюцинации и дорогая цена красивой ошибки.</span></a>\n<a href=\"#learning\" data-wiki=\"learning\"><b>Можно ли отупеть</b><span>Когнитивная разгрузка, обучение и разница между помощником и заменителем.</span></a>\n<a href=\"#public-opinion\" data-wiki=\"public-opinion\"><b>Как люди воспринимают ИИ</b><span>Эксперты, публика, США и Европа: пользы хотят, контроля — тоже.</span></a>\n</div>\n<blockquote>Какие способности мы хотим усилить при помощи ИИ, а какие считаем настолько важными для человека, что готовы сознательно делать их сами — даже когда машина сделает быстрее?</blockquote>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#what-is-ai\" data-wiki=\"what-is-ai\">Что мы вообще называем искусственным интеллектом</a></li><li><a href=\"#history-revolutions\" data-wiki=\"history-revolutions\">От письменности и станков до ChatGPT</a></li><li><a href=\"#productivity\" data-wiki=\"productivity\">Где ИИ действительно повышает производительность</a></li><li><a href=\"#learning\" data-wiki=\"learning\">Можно ли отупеть от ChatGPT</a></li><li><a href=\"#public-opinion\" data-wiki=\"public-opinion\">Как люди на самом деле относятся к ИИ</a></li></ul></section>", "related": ["what-is-ai", "history-revolutions", "productivity", "learning", "public-opinion"]}, {"id": "what-is-ai", "section": "Основы", "title": "Что мы вообще называем искусственным интеллектом", "keywords": ["определение OECD", "генеративный ИИ", "машинная система", "эффект ИИ", "ChatGPT"], "html": "\n<p class=\"lead\">Слово «интеллект» в названии здорово сбивает с толку. Для практического разговора ИИ не нужно приписывать сознание, чувства или человеческое понимание мира.</p>\n<p>Рабочее определение OECD прозаичнее: <strong>система ИИ — это машинная система, которая получает входные данные и выводит из них, как создать прогноз, содержание, рекомендацию или решение, способное влиять на физическую или виртуальную среду</strong>. Такие системы различаются степенью автономности и способностью изменяться после внедрения.</p>\n<p>Удобство этого определения именно в том, что оно ничего не говорит о «разуме как у человека». Чтобы программа считалась ИИ, ей не нужно сидеть ночью у окна и размышлять о смерти.</p>\n<h2>Что входит в это понятие</h2>\n<ul>\n<li>распознавание лиц и речи;</li>\n<li>рекомендательные системы YouTube или Spotify;</li>\n<li>системы диагностики изображений;</li>\n<li>алгоритмы машинного обучения для прогнозирования;</li>\n<li>большие языковые модели, на которых работают современные чат-боты;</li>\n<li>генераторы изображений, видео, музыки и программного кода.</li>\n</ul>\n<p>ChatGPT-подобные системы — это <strong>генеративный ИИ</strong>, то есть лишь одна ветвь ИИ. Они создают новое содержимое на основании закономерностей, извлечённых из огромных массивов данных. Говорить «ИИ» и подразумевать только чат-боты примерно так же точно, как говорить «транспорт» и иметь в виду исключительно электросамокаты.</p>\n<div class=\"callout\"><strong>Эффект ИИ</strong><p>Технологии часто перестают казаться нам ИИ, когда становятся привычными. Оптическое распознавание текста когда-то считалось серьёзным достижением; сегодня мало кто думает об ИИ, фотографируя страницу телефоном. Вчерашнее чудо становится сегодняшней кнопкой.</p></div>\n<h2>Полезная граница</h2>\n<p>Вместо спора «настоящий это ИИ или нет?» полезнее спрашивать: <strong>что система умеет, из чего получает ответ, где ошибается и кто принимает окончательное решение</strong>.</p>\n<blockquote>Если технология перестаёт казаться нам искусственным интеллектом, как только мы к ней привыкли, то чего именно мы боимся сегодня: самой технологии или её новизны и непредсказуемости?</blockquote>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#spread-digitalization\" data-wiki=\"spread-digitalization\">Чем нынешняя волна отличается от прежней цифровизации</a></li><li><a href=\"#history-revolutions\" data-wiki=\"history-revolutions\">От письменности и станков до ChatGPT</a></li><li><a href=\"#errors-limits\" data-wiki=\"errors-limits\">Ошибки, «зубчатая граница» и иллюзия эффективности</a></li><li><a href=\"#ethics\" data-wiki=\"ethics\">Может ли технология быть этичной или неэтичной</a></li></ul></section>", "related": ["spread-digitalization", "history-revolutions", "errors-limits", "ethics"]}, {"id": "history-revolutions", "section": "Контекст", "title": "От письменности и станков до ChatGPT", "keywords": ["Платон", "Федр", "печатный станок", "луддиты", "промышленная революция", "история технологий"], "html": "\n<p class=\"lead\">Страх перед новой технологией — не новое изобретение. Но фраза «люди всегда боялись, а потом всё было хорошо» исторически слишком удобная и потому плохая.</p>\n<div class=\"timeline\">\n<div class=\"time\"><span>Античность</span><div><b>Письменность</b><p>В платоновском «Федре» обсуждается опасение, что письменность создаст лишь видимость знания: люди смогут обращаться к записанному тексту и поэтому хуже будут тренировать собственную память. Это философский текст, а не опрос общественного мнения Древней Греции, но тревога знакомая: «внешний инструмент памяти сделает собственный ум слабее».</p></div></div>\n<div class=\"time\"><span>XVI–XVII вв.</span><div><b>Печатный станок и избыток информации</b><p>Европейские учёные жаловались на избыток книг и вырабатывали способы фильтрации, конспектирования и быстрого поиска. Наше «я уже не могу читать весь этот интернет» имеет весьма почтенных предков.</p></div></div>\n<div class=\"time\"><span>Начало XIX в.</span><div><b>Луддиты и механизация</b><p>Исторически луддиты были не просто «врагами прогресса». Многие были квалифицированными работниками и протестовали прежде всего против того, как владельцы фабрик использовали машины для изменения оплаты, статуса и организации труда. Конфликт был про распределение выгод и потерь, а не про мистический страх шестерёнок.</p></div></div>\n<div class=\"time\"><span>Сегодня</span><div><b>Генеративный ИИ</b><p>Спор снова касается не только возможностей машины, но и контроля, статуса труда, квалификации, авторства и ответственности.</p></div></div>\n</div>\n<h2>Что исторические аналогии действительно показывают</h2>\n<p>Иногда страхи перед технологией были преувеличенными. Иногда — нет. Промышленная революция действительно увеличила производительность, но одновременно разрушила множество прежних профессий и форм организации труда.</p>\n<div class=\"callout key\"><strong>Важно различать</strong><p><strong>Технологический прогресс в среднем</strong> и <strong>выгода конкретного человека</strong> — совершенно не одно и то же.</p></div>\n<p>Поэтому прошлые революции полезны как набор сравнений, но не как доказательство, что нынешние риски «сами рассосутся».</p>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#spread-digitalization\" data-wiki=\"spread-digitalization\">Чем нынешняя волна отличается от прежней цифровизации</a></li><li><a href=\"#work\" data-wiki=\"work\">Рынок труда: трансформация профессий и проблема новичков</a></li><li><a href=\"#learning\" data-wiki=\"learning\">Можно ли отупеть от ChatGPT</a></li><li><a href=\"#public-opinion\" data-wiki=\"public-opinion\">Как люди на самом деле относятся к ИИ</a></li></ul></section>", "related": ["spread-digitalization", "work", "learning", "public-opinion"]}, {"id": "spread-digitalization", "section": "Контекст", "title": "Чем нынешняя волна отличается от прежней цифровизации", "keywords": ["цифровизация", "машинное обучение", "генеративный ИИ", "скорость распространения", "53%", "88%", "Eurostat"], "html": "\n<p class=\"lead\">Главное отличие не в том, что «раньше ИИ не было». Он существует десятилетиями. Изменился характер массового применения: компьютер всё чаще не только исполняет правило, но и производит содержимое и варианты решения.</p>\n<div class=\"process\" aria-label=\"Три режима автоматизации\">\n<div><b>Цифровизация</b><p>Человек определил правило → компьютер очень быстро его исполняет.</p></div><span>→</span><div><b>Машинный ИИ</b><p>Человек дал данные и цель → система выявляет закономерности и генерирует результат.</p></div><span>→</span><div><b>Генеративный ИИ</b><p>Человек формулирует задачу обычным языком → система создаёт текст, изображение, код, анализ или последовательность действий.</p></div>\n</div>\n<p>Граница не абсолютная: традиционный софт никуда не исчез, а машинное обучение давно встроено в продукты. Разница именно в том, что современный ИИ получает закономерности из обучающих данных, а не только выполняет полностью прописанные человеком инструкции.</p>\n<h2>Скорость распространения</h2>\n<table><thead><tr><th>Показатель</th><th>Данные из исследования</th></tr></thead><tbody>\n<tr><td>Охват генеративного ИИ</td><td>Около <strong>53%</strong> населения по методике Stanford AI Index 2026 за три года — быстрее раннего распространения ПК и интернета.</td></tr>\n<tr><td>Организации</td><td>В 2025 году <strong>88%</strong> опрошенных организаций сообщали об использовании ИИ в той или иной форме.</td></tr>\n<tr><td>Предприятия ЕС</td><td>Около <strong>20%</strong> в 2025 году против 13% годом ранее; среди крупных компаний — примерно 55%.</td></tr>\n<tr><td>Люди 16–24 в ЕС</td><td>Генеративным ИИ пользовались <strong>63,8%</strong>; среди всего населения 16–74 лет — 32,7%.</td></tr>\n</tbody></table>\n<p>Печатный станок распространял написанное человеком. Интернет позволил мгновенно найти и передать написанное человеком. Генеративный ИИ способен <strong>сам производить содержимое по запросу</strong>.</p>\n<p>Ещё одно отличие: промышленная автоматизация прежде всего конкурировала с мышцами и повторяющимися физическими действиями. Современный ИИ входит в области, которые долго считались убежищем человека: язык, рисунок, программирование, анализ, обучение и творчество.</p>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#what-is-ai\" data-wiki=\"what-is-ai\">Что мы вообще называем искусственным интеллектом</a></li><li><a href=\"#history-revolutions\" data-wiki=\"history-revolutions\">От письменности и станков до ChatGPT</a></li><li><a href=\"#productivity\" data-wiki=\"productivity\">Где ИИ действительно повышает производительность</a></li><li><a href=\"#work\" data-wiki=\"work\">Рынок труда: трансформация профессий и проблема новичков</a></li><li><a href=\"#practice-future\" data-wiki=\"practice-future\">Чего разумно хотеть от ИИ и чего ждать дальше</a></li></ul></section>", "related": ["what-is-ai", "history-revolutions", "productivity", "work", "practice-future"]}, {"id": "productivity", "section": "Польза и ограничения", "title": "Где ИИ действительно повышает производительность", "keywords": ["производительность", "40%", "18%", "14%", "BCG", "25%", "12%", "контакт-центр", "консультанты"], "html": "\n<p class=\"lead\">Да, ИИ способен давать очень большой выигрыш. Но цифры работают только в контексте конкретной задачи — и именно здесь начинаются неприятные детали.</p>\n<h2>Профессиональное письмо</h2>\n<p>В эксперименте Шакеда Ноя и Уитни Чжан участники выполняли профессиональные письменные задания: пресс-релизы, краткие отчёты, электронные письма и подобные задачи. Доступ к ChatGPT в среднем <strong>сократил затрачиваемое время примерно на 40%</strong> и <strong>повысил оценённое качество примерно на 18%</strong>. Результаты были опубликованы в <em>Science</em>.</p>\n<p>Условная задача на 50 минут превращается примерно в 30. Причём сильнее ИИ помогал тем, кто изначально справлялся хуже: на некоторых задачах технология способна сжимать разрыв между менее и более сильными исполнителями.</p>\n<h2>Контакт-центр</h2>\n<p>Полевое исследование Эрика Бриньолфссона, Даниэль Ли и Линдси Рэймонд показало рост производительности работников с генеративным помощником примерно на <strong>14% в среднем</strong>. Особенно большой выигрыш получили менее опытные и менее продуктивные сотрудники.</p>\n<p>Одна из интерпретаций: ИИ распространяет шаблоны поведения лучших работников среди остальных, превращая накопленный опыт организации в доступную подсказку новичку.</p>\n<h2>Консультанты BCG</h2>\n<p>В эксперименте Harvard Business School и BCG для задач, находившихся «внутри возможностей» GPT-4, пользователи ИИ выполняли примерно <strong>на 12% больше заданий</strong>, работали примерно <strong>на 25% быстрее</strong>, а качество результатов было заметно выше.</p>\n<div class=\"stat-grid\">\n<div><strong>−40%</strong><span>времени на письменные задания</span></div>\n<div><strong>+18%</strong><span>оценённое качество</span></div>\n<div><strong>+14%</strong><span>производительность в контакт-центре</span></div>\n<div><strong>+25%</strong><span>скорость консультантов на подходящих задачах</span></div>\n</div>\n<div class=\"callout key\"><strong>Но не превращайте цифры в религию</strong><p>Те же исследования показывают: эффект зависит от задачи, опыта пользователя и того, находится ли конкретная проблема внутри реальных возможностей модели.</p></div>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#errors-limits\" data-wiki=\"errors-limits\">Ошибки, «зубчатая граница» и иллюзия эффективности</a></li><li><a href=\"#science-access\" data-wiki=\"science-access\">Наука, доступ и удешевление интеллектуальной работы</a></li><li><a href=\"#work\" data-wiki=\"work\">Рынок труда: трансформация профессий и проблема новичков</a></li><li><a href=\"#practice-future\" data-wiki=\"practice-future\">Чего разумно хотеть от ИИ и чего ждать дальше</a></li></ul></section>", "related": ["errors-limits", "science-access", "work", "practice-future"]}, {"id": "science-access", "section": "Польза и ограничения", "title": "Наука, доступ и удешевление интеллектуальной работы", "keywords": ["AlphaFold", "200 миллионов", "3 миллиона исследователей", "доступ", "демократизация", "черновик"], "html": "\n<p class=\"lead\">Сводить ИИ к «чат-боту, который пишет сочинения» — довольно узкий взгляд. Самые серьёзные применения вообще могут происходить далеко от чата.</p>\n<h2>AlphaFold как пример</h2>\n<p>Определение трёхмерной структуры белка экспериментальными методами традиционно могло занимать месяцы или годы. AlphaFold научился с высокой точностью предсказывать структуру белка по его аминокислотной последовательности.</p>\n<p>В 2022 году исследователи опубликовали предсказания для <strong>более чем 200 миллионов белковых структур</strong> — почти всех каталогизированных на тот момент белков. К 2025 году база использовалась более чем <strong>тремя миллионами исследователей из более чем 190 стран</strong>, по данным DeepMind. Её применяют в исследованиях болезней, устойчивости сельскохозяйственных культур и других биологических задач.</p>\n<h2>Снижение цены интеллектуальной работы</h2>\n<p>Человек, который не умеет программировать, теперь способен создать небольшой скрипт; носитель одного языка — получить черновой перевод; студент — объяснение математической задачи; сотрудник — обработать массив текста.</p>\n<p>В этом есть потенциально сильный демократизирующий эффект: <strong>некоторые навыки перестают быть дефицитным входным билетом в деятельность</strong>.</p>\n<p>Но обратная сторона появляется мгновенно. Когда производство текста, изображения или кода становится почти бесплатным, <strong>ценность самого производства падает, а ценность постановки задачи, отбора и проверки растёт</strong>.</p>\n<div class=\"callout\"><strong>Сдвиг дефицита</strong><p>Раньше проблема звучала: «Как мне это написать?» Всё чаще она звучит иначе: «Как понять, что из тридцати сгенерированных вариантов вообще имеет смысл?»</p></div>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#productivity\" data-wiki=\"productivity\">Где ИИ действительно повышает производительность</a></li><li><a href=\"#errors-limits\" data-wiki=\"errors-limits\">Ошибки, «зубчатая граница» и иллюзия эффективности</a></li><li><a href=\"#creativity\" data-wiki=\"creativity\">Творчество: выше средний уровень, меньше разнообразия</a></li><li><a href=\"#practice-future\" data-wiki=\"practice-future\">Чего разумно хотеть от ИИ и чего ждать дальше</a></li></ul></section>", "related": ["productivity", "errors-limits", "creativity", "practice-future"]}, {"id": "errors-limits", "section": "Польза и ограничения", "title": "Ошибки, «зубчатая граница» и иллюзия эффективности", "keywords": ["галлюцинации", "зубчатая граница", "METR", "362", "233", "19%", "аналоговые часы", "ошибки"], "html": "\n<p class=\"lead\">ИИ похож не на «очень умного человека», а на странного специалиста с феноменальными знаниями и неожиданными слепыми пятнами.</p>\n<h2>Зубчатая граница возможностей</h2>\n<p>В эксперименте с консультантами исследователи специально дали задачу, на которой модель работала плохо. Люди, вооружённые очень убедительно отвечающей моделью, <strong>чаще приходили к неправильному выводу</strong>.</p>\n<p>Отсюда термин <strong>«зубчатая граница»</strong>: модель может быть почти сверхчеловеческой в одной задаче и неожиданно беспомощной в похожей. Stanford AI Index 2026 приводит показательный пример: лучшие системы показывают чрезвычайно высокие результаты на сложных математических и научных тестах, но ведущая модель в одном из тестов на чтение аналоговых часов правильно определяла время лишь примерно в половине случаев.</p>\n<h2>Убедительная ошибка</h2>\n<p>Генеративная модель не обязана иметь внутренний механизм вида «я этого не знаю». Она генерирует наиболее подходящий ответ, поэтому фактически неверный текст может выглядеть так же уверенно, как правильный.</p>\n<p>Stanford AI Index зафиксировал <strong>362 документированных инцидента</strong>, связанных с ИИ, в 2025 году против 233 в 2024-м. Это не означает, что «ИИ стал на X процентов опаснее»: систем стало больше. Но реальные ошибки давно не лабораторная экзотика.</p>\n<p>На специальном тесте, проверяющем различение знания и ошибочного убеждения пользователя, у 26 ведущих моделей частота галлюцинаций составляла от <strong>22% до 94%</strong>. Это <strong>не универсальная частота ошибок ChatGPT</strong>; речь о конкретном сложном тесте. Зато результат показывает, насколько резко надёжность может падать в определённых ситуациях.</p>\n<blockquote>Чем дороже ошибка, тем меньше ценность красивого ответа и тем больше ценность независимой проверки.</blockquote>\n<h2>Иногда ИИ ещё и замедляет</h2>\n<p>В 2025 году METR провела эксперимент: <strong>16 опытных разработчиков открытого ПО выполняли 246 реальных задач</strong> в знакомых им проектах. Они ожидали, что ИИ ускорит их примерно на 24%.</p>\n<p>На практике задачи с ИИ заняли у них <strong>примерно на 19% больше времени</strong>. Причём даже после эксперимента многие продолжали ощущать, что технология их ускоряла.</p>\n<p>Причина интуитивно понятна: модель печатает страницу кода за секунды, ощущение скорости бешеное; затем время уходит на чтение, проверку, исправление, объяснение контекста и откат плохих решений.</p>\n<p>METR отдельно предупреждает, что результат нельзя переносить на всё программирование: речь шла об опытных разработчиках, знакомых сложных репозиториях и инструментах начала 2025 года. Вывод уже полезен без лишней драматургии: <strong>ощущение полезности ещё не является доказательством полезности</strong>.</p>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#productivity\" data-wiki=\"productivity\">Где ИИ действительно повышает производительность</a></li><li><a href=\"#learning\" data-wiki=\"learning\">Можно ли отупеть от ChatGPT</a></li><li><a href=\"#ethics\" data-wiki=\"ethics\">Может ли технология быть этичной или неэтичной</a></li><li><a href=\"#practice-future\" data-wiki=\"practice-future\">Чего разумно хотеть от ИИ и чего ждать дальше</a></li></ul></section>", "related": ["productivity", "learning", "ethics", "practice-future"]}, {"id": "work", "section": "Общество", "title": "Рынок труда: трансформация профессий и проблема новичков", "keywords": ["ILO", "3,3%", "четверть работников", "рынок труда", "профессии", "новички", "эксперты"], "html": "\n<p class=\"lead\">Простая история «ИИ заменит всех» пока плохо описывает данные. Но столь же плохо работает и успокоительное «ничего не изменится».</p>\n<p>ILO в 2025 году оценивала, что примерно <strong>каждый четвёртый работник в мире</strong> занят в профессии с некоторой степенью воздействия генеративного ИИ, однако лишь около <strong>3,3% мировой занятости</strong> приходится на самую высокую категорию воздействия.</p>\n<p>Сильнее всего затронуты административные и офисные профессии. При этом ILO подчёркивает: <strong>«профессия затронута ИИ» не значит «профессия исчезнет»</strong>. Большинство рабочих мест состоит из набора разных задач, поэтому ближайший сценарий скорее связан с изменением содержания работы, чем с полным исчезновением должностей.</p>\n<h2>Проблема лестницы квалификации</h2>\n<p>Есть менее очевидный риск. Младший юрист учится, составляя простые документы; младший программист — решая простые ошибки; начинающий переводчик — переводя простые тексты. Именно такие входные задачи ИИ часто автоматизирует раньше сложных.</p>\n<blockquote>Если ИИ заберёт работу новичка, откуда через десять лет возьмётся эксперт?</blockquote>\n<p>Пока это скорее открытая проблема, чем доказанный долгосрочный эффект. Но вопрос возникает напрямую из структуры автоматизации: технология способна убрать часть «учебной» работы, на которой раньше выращивалась квалификация.</p>\n<div class=\"callout\"><strong>Что стоит отслеживать</strong><p>Не только число сокращённых должностей, но и то, какие задачи исчезают из профессии, какие навыки перестают тренироваться и остаётся ли у новичков маршрут к экспертности.</p></div>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#productivity\" data-wiki=\"productivity\">Где ИИ действительно повышает производительность</a></li><li><a href=\"#learning\" data-wiki=\"learning\">Можно ли отупеть от ChatGPT</a></li><li><a href=\"#creativity\" data-wiki=\"creativity\">Творчество: выше средний уровень, меньше разнообразия</a></li><li><a href=\"#ethics\" data-wiki=\"ethics\">Может ли технология быть этичной или неэтичной</a></li><li><a href=\"#practice-future\" data-wiki=\"practice-future\">Чего разумно хотеть от ИИ и чего ждать дальше</a></li></ul></section>", "related": ["productivity", "learning", "creativity", "ethics", "practice-future"]}, {"id": "creativity", "section": "Общество", "title": "Творчество: выше средний уровень, меньше разнообразия", "keywords": ["творчество", "усреднение", "разнообразие", "brainstorming", "качество", "генеративный ИИ"], "html": "\n<p class=\"lead\">Генеративный ИИ способен выравнивать способности людей — и одновременно делать результаты похожее друг на друга. Удобство тут приходит с довольно заметной ценой.</p>\n<p>Исследования творческих заданий показывают, что генеративные инструменты могут повышать качество работы отдельного человека, особенно менее сильного автора, но одновременно делать результаты разных людей <strong>более похожими</strong>.</p>\n<div class=\"balance\"><div><strong>Выше средний уровень</strong><p>Человек получает сильный старт, идеи, черновики и варианты, которые раньше требовали большего опыта.</p></div><div><strong>Меньше разнообразия</strong><p>Если десять человек начинают мозговой штурм с одного и того же чат-бота, это уже не десять независимых стартовых точек.</p></div></div>\n<p>Это реалистичная цена удобства: вместо десятка разных направлений мы можем получить десяток вариаций статистически вероятных идей.</p>\n<p>Поэтому сильный аргумент против бездумного использования генеративного ИИ касается не только авторского права или «настоящего творчества», а <strong>культурной усреднённости</strong>.</p>\n<h2>Что ИИ в целом даёт и может забирать</h2>\n<table><thead><tr><th>Даёт</th><th>Может забирать</th></tr></thead><tbody>\n<tr><td>скорость</td><td>самостоятельную практику</td></tr>\n<tr><td>доступ к знаниям</td><td>внимание к деталям</td></tr>\n<tr><td>дешёвый черновик</td><td>часть профессиональных навыков</td></tr>\n<tr><td>снижение барьера входа</td><td>уверенность в происхождении информации</td></tr>\n<tr><td>помощь новичку</td><td>часть входных задач для новичков</td></tr>\n<tr><td>масштабирование экспертизы</td><td>разнообразие решений</td></tr>\n</tbody></table>\n<blockquote>ИИ особенно полезен как усилитель человека и особенно опасен как незаметная замена человеческому суждению.</blockquote>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#science-access\" data-wiki=\"science-access\">Наука, доступ и удешевление интеллектуальной работы</a></li><li><a href=\"#work\" data-wiki=\"work\">Рынок труда: трансформация профессий и проблема новичков</a></li><li><a href=\"#learning\" data-wiki=\"learning\">Можно ли отупеть от ChatGPT</a></li><li><a href=\"#practice-future\" data-wiki=\"practice-future\">Чего разумно хотеть от ИИ и чего ждать дальше</a></li></ul></section>", "related": ["science-access", "work", "learning", "practice-future"]}, {"id": "learning", "section": "Человек и ИИ", "title": "Можно ли отупеть от ChatGPT", "keywords": ["когнитивная разгрузка", "обучение", "PNAS", "репетитор", "критическое мышление", "CHI 2025", "PISA 2025"], "html": "\n<p class=\"lead\">Доказательств общего снижения интеллекта от использования ChatGPT нет. Но есть более узкий и вполне реальный риск: мы можем перестать тренировать те операции, которые постоянно отдаём инструменту.</p>\n<h2>Когнитивная разгрузка</h2>\n<p><strong>Когнитивная разгрузка</strong> — перенос части мыслительных операций на внешний инструмент. Калькулятор разгружает арифметику. GPS — навигацию. Поисковик — запоминание фактов. Генеративный ИИ может разгружать планирование, формулирование аргумента, написание текста, поиск решения и программирование.</p>\n<p>Сам по себе эффект не хороший и не плохой. Вопрос — <strong>что человек делает с высвободившимися умственными ресурсами</strong>.</p>\n<h2>Эксперимент со школьниками</h2>\n<p>В опубликованном в <em>PNAS</em> исследовании почти тысяча школьников изучала математику при помощи GPT-4. Одна группа получила инструмент, близкий к обычному универсальному чат-боту; другая — специального AI-репетитора, который скорее давал подсказки, чем готовые решения.</p>\n<p>При доступе к ИИ учащиеся решали задачи лучше. Но когда ИИ убирали, ученики, использовавшие обычный вариант без образовательных ограничений, <strong>хуже справлялись самостоятельно</strong>. Негативный эффект в значительной степени удалось убрать у tutor-варианта, который поддерживал учебный процесс, а не выполнял его вместо ученика.</p>\n<div class=\"callout key\"><strong>Практический вывод</strong><p>От самого наличия ChatGPT — нет оснований говорить об «отупении». От привычки заменять им ту умственную работу, которую вы хотите научиться делать сами, риск вполне реален.</p></div>\n<h2>Спортзал для мышления</h2>\n<p>Если экзоскелет помогает поднять вес, сегодня вы поднимете больше. Но если цель была развить мышцы, устройство, сделавшее всю работу вместо вас, победило не ту задачу. С мышлением примерно то же.</p>\n<h2>ИИ может и улучшать обучение</h2>\n<p>В рандомизированном исследовании Гарварда, опубликованном в <em>Scientific Reports</em> в 2025 году, специально разработанный AI-репетитор позволил студентам обучаться эффективнее, чем традиционное занятие с активным участием учащихся, причём студенты тратили меньше времени.</p>\n<div class=\"compare-use\"><div><b>ИИ отвечает вместо вас</b><p>«Реши задачу и напиши ответ».</p></div><div><b>ИИ заставляет думать</b><p>«Не давай ответ. Задавай вопросы по одному, пока я сам не дойду до решения. Если ошибаюсь — покажи где».</p></div></div>\n<p>Это психологически разные инструменты. Второй режим превращает ИИ из заменителя мышления в <strong>интеллектуального спарринг-партнёра</strong>.</p>\n<h2>Критическое мышление</h2>\n<p>Исследование CHI 2025 опросило <strong>319 работников умственного труда</strong>, использовавших генеративный ИИ. Чем выше была уверенность пользователя в ИИ, тем меньше критического усилия он сообщал о своей работе; высокая уверенность в собственных силах, напротив, была связана с большим критическим осмыслением.</p>\n<p>Но это в значительной степени самоотчёты, а не эксперимент, доказывающий причинность. Поэтому заголовок «Microsoft доказала, что ChatGPT делает людей глупыми» был бы красивым и неправдивым одновременно.</p>\n<p>Данные OECD по PISA 2025 тоже дают сложную картину: некоторые формы частого использования ИИ связаны с худшими результатами, тогда как развитие <strong>AI literacy — понимания принципов и ограничений ИИ</strong> — связано с более благоприятной картиной. Корреляция сама по себе не доказывает причинность.</p>\n<p><strong>Мы уже знаем достаточно, чтобы не считать интеллектуальную зависимость выдумкой, но пока слишком мало, чтобы объявить ChatGPT машиной массового отупления.</strong></p>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#errors-limits\" data-wiki=\"errors-limits\">Ошибки, «зубчатая граница» и иллюзия эффективности</a></li><li><a href=\"#work\" data-wiki=\"work\">Рынок труда: трансформация профессий и проблема новичков</a></li><li><a href=\"#ethics\" data-wiki=\"ethics\">Может ли технология быть этичной или неэтичной</a></li><li><a href=\"#practice-future\" data-wiki=\"practice-future\">Чего разумно хотеть от ИИ и чего ждать дальше</a></li><li><a href=\"#discussion\" data-wiki=\"discussion\">Личный опыт и вопросы для дискуссионного клуба</a></li></ul></section>", "related": ["errors-limits", "work", "ethics", "practice-future", "discussion"]}, {"id": "ethics", "section": "Человек и ИИ", "title": "Может ли технология быть этичной или неэтичной", "keywords": ["этика", "ответственность", "UNESCO", "OECD", "нейтральность", "контроль", "предвзятость"], "html": "\n<p class=\"lead\">В узком философском смысле технология не является моральным субъектом. Но отсюда совершенно не следует, что её проектирование и применение нейтральны.</p>\n<p>Молоток не «виноват» в том, что им ударили человека. Языковая модель тоже не несёт моральной ответственности в человеческом смысле. Однако в систему кто-то закладывает:</p>\n<ul><li>цель;</li><li>данные;</li><li>критерий оптимизации;</li><li>набор допустимых действий;</li><li>правила доступа;</li><li>допустимый уровень риска.</li></ul>\n<p>Поэтому <strong>этичным или неэтичным может быть проектирование, производство, обучение, внедрение и использование системы</strong>.</p>\n<p>UNESCO связывает ответственное применение ИИ с правами человека, недискриминацией, прозрачностью, человеческим контролем и ответственностью. OECD отдельно подчёркивает: какими бы автономными ни были AI-системы, вопрос ответственности за последствия в конечном счёте остаётся человеческим.</p>\n<h2>Пример с медициной</h2>\n<p>Алгоритм, прогнозирующий вероятность болезни, сам по себе не «добрый» и не «злой». Но система становится этически проблемной, если она обучена на нерепрезентативных данных, систематически хуже работает для части населения, используется без информирования пациентов, не позволяет врачу оспорить решение и при этом определяет доступ человека к лечению.</p>\n<div class=\"callout key\"><strong>Полезнее другого вопроса</strong><p>Вместо «этичен ли ИИ?» спросите: <strong>кто принимает решение, на основании каких данных, кто получает выгоду, кто несёт риск и кто отвечает за ошибку?</strong></p></div>\n<p>Тогда этика перестаёт быть декоративным разделом корпоративной презентации и превращается в набор конкретных требований к системе.</p>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#errors-limits\" data-wiki=\"errors-limits\">Ошибки, «зубчатая граница» и иллюзия эффективности</a></li><li><a href=\"#work\" data-wiki=\"work\">Рынок труда: трансформация профессий и проблема новичков</a></li><li><a href=\"#public-opinion\" data-wiki=\"public-opinion\">Как люди на самом деле относятся к ИИ</a></li><li><a href=\"#practice-future\" data-wiki=\"practice-future\">Чего разумно хотеть от ИИ и чего ждать дальше</a></li></ul></section>", "related": ["errors-limits", "work", "public-opinion", "practice-future"]}, {"id": "public-opinion", "section": "Общество", "title": "Как люди на самом деле относятся к ИИ", "keywords": ["общественное мнение", "Pew", "эксперты", "США", "Европа", "54%", "91%", "80%", "87%", "амбивалентность"], "html": "\n<p class=\"lead\">Общественное настроение лучше описывается не словами «оптимизм» или «страх», а словом <strong>амбивалентность</strong>: люди одновременно видят пользу и нервничают из-за последствий.</p>\n<h2>Публика и AI-эксперты в США</h2>\n<p>Stanford AI Index 2026 фиксирует большой разрыв: <strong>73%</strong> опрошенных экспертов ожидают положительного влияния ИИ на то, как люди работают, против лишь <strong>23%</strong> населения.</p>\n<div class=\"bar-chart\" role=\"img\" aria-label=\"Сравнение взглядов населения и экспертов\">\n<div class=\"bar-row\"><span>Положительное влияние на работу — эксперты</span><i><b style=\"width:73%\"></b></i><em>73%</em></div>\n<div class=\"bar-row\"><span>Положительное влияние на работу — публика</span><i><b style=\"width:23%\"></b></i><em>23%</em></div>\n</div>\n<p>По данным Pew, <strong>51%</strong> взрослых американцев были скорее обеспокоены распространением ИИ, чем воодушевлены, тогда как среди опрошенных AI-экспертов таких было <strong>15%</strong>. Преимущественно воодушевлены были 47% экспертов и лишь 11% населения.</p>\n<table><thead><tr><th>Опасение</th><th>Население США</th><th>AI-эксперты</th></tr></thead><tbody>\n<tr><td>ИИ устранит рабочие места</td><td>56%</td><td>25%</td></tr>\n<tr><td>Потеря человеческого общения</td><td>57%</td><td>37%</td></tr>\n<tr><td>Неверная информация</td><td>66%</td><td>70%</td></tr>\n<tr><td>Предвзятость ИИ</td><td>55%</td><td>55%</td></tr>\n</tbody></table>\n<p>Когда спрашивали о личном эффекте, <strong>43%</strong> американцев считали, что ИИ скорее навредит им лично, и 24% — что скорее принесёт пользу. Среди экспертов картина была обратной: 76% ожидали личной пользы и 15% — вреда.</p>\n<p>Ограничение важное: выборка экспертов Pew строилась по участникам AI-конференций и не считается статистически репрезентативной для всех специалистов. Превращать разницу в «умные понимают, глупые боятся» было бы особенно глупо.</p>\n<h2>Европа: польза да, бесконтрольность нет</h2>\n<p>В опросе Европейской комиссии, опубликованном в мае 2026 года и охватывавшем 18 стран ЕС, <strong>54%</strong> респондентов сообщили об использовании ИИ. Среди применяющих ИИ на работе <strong>91%</strong> заявили, что он помогает выполнять задачи быстрее, а примерно двое из пяти сообщали о значительном выигрыше.</p>\n<p>Одновременно <strong>80%</strong> европейцев поддерживали осторожное регулирование ИИ, а <strong>87%</strong> считали манипуляции, дезинформацию, дипфейки и AI-содержимое угрозой демократии.</p>\n<blockquote>«Да, дайте мне эту штуку для работы. Нет, пожалуйста, не отдавайте этой штуке общество целиком».</blockquote>\n<h2>Почему отношение именно такое</h2>\n<p>Из совокупности опросов видны три разумных объяснения, хотя строгую причинность они не доказывают. Во-первых, непосредственная выгода повышает принятие: работающий с ИИ видит конкретную экономию времени, а человек, встречающий технологию в новостях о мошенничестве и сокращениях, видит другой набор эффектов.</p>\n<p>Во-вторых, страх касается прежде всего <strong>потери контроля</strong>: люди спокойнее относятся к инструменту, когда сами решают, пользоваться им или нет, и тревожнее — когда алгоритм решает вопросы найма, кредита, медицины или доступа к информации.</p>\n<p>В-третьих, преимущества и риски распределены неравномерно. Начинающий офисный работник, художник, программист, предприниматель и пенсионер смотрят на одну технологию из разных точек.</p>\n<p>Поэтому вопрос «люди за ИИ или против?» почти бесполезен. Полезнее: <strong>какой ИИ, для какой задачи и при каких правилах люди готовы принять?</strong></p>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#work\" data-wiki=\"work\">Рынок труда: трансформация профессий и проблема новичков</a></li><li><a href=\"#ethics\" data-wiki=\"ethics\">Может ли технология быть этичной или неэтичной</a></li><li><a href=\"#spread-digitalization\" data-wiki=\"spread-digitalization\">Чем нынешняя волна отличается от прежней цифровизации</a></li><li><a href=\"#discussion\" data-wiki=\"discussion\">Личный опыт и вопросы для дискуссионного клуба</a></li></ul></section>", "related": ["work", "ethics", "spread-digitalization", "discussion"]}, {"id": "practice-future", "section": "Практика", "title": "Чего разумно хотеть от ИИ и чего ждать дальше", "keywords": ["человеческая автономия", "AI literacy", "будущее", "агенты", "первый черновик", "контроль", "проверка"], "html": "\n<p class=\"lead\">Наиболее защищаемая позиция по совокупности исследований: <strong>ИИ должен усиливать человеческую способность действовать, а не незаметно подменять её</strong>.</p>\n<h2>Как это выглядит на практике</h2>\n<p>В обучении полезнее системы, которые <strong>подсказывают, задают вопросы и объясняют</strong>, а не максимально быстро выдают готовый ответ. На работе разумно автоматизировать рутинную часть задачи, сохраняя у человека возможность понимать и проверять результат.</p>\n<p>При решениях с серьёзными последствиями нужны понятные механизмы человеческого контроля, оспаривания и ответственности. И обществу понадобится не только умение «писать хорошие промпты», которое успело раздуться до отдельной религии, а <strong>AI-грамотность</strong>: понимать, когда модель полезна, откуда берётся ошибка, как проверить источник, какие данные нельзя ей отдавать и где решение должен принимать человек.</p>\n<h2>Ближайшие годы</h2>\n<p>Данные скорее указывают не на сценарий «ИИ либо провалится, либо завтра заменит всех», а на менее кинематографичный процесс: он будет постепенно встраиваться почти во все цифровые инструменты, а граница между программой и AI-помощником начнёт исчезать.</p>\n<p>В 2025 году 88% организаций в выборке Stanford AI Index сообщали о каком-либо использовании ИИ, однако более автономные AI-агенты пока использовались лишь единицами процентов организаций в большинстве бизнес-функций. Между сегодняшним «чатом, который помогает сотруднику» и фантазией о полностью автономной компании лежит приличная дистанция.</p>\n<h2>Что дешевеет и что дорожает</h2>\n<p>Устойчивая тенденция: <strong>стоимость первого черновика падает</strong>. Текст, код, перевод, изображение, презентация, резюме документа, предварительный анализ — всё это становится дешёвым.</p>\n<p>Зато дорожают другие способности: поставить хороший вопрос, понять контекст, проверить ответ, заметить неочевидную ошибку, выбрать между вариантами, взять ответственность и придумать то, что не является среднестатистическим продолжением прошлого.</p>\n<div class=\"callout key\"><strong>Ирония</strong><p>Чем умнее становятся машины, тем важнее становится не способность человека быстро производить ответы, а способность понимать, <strong>какие ответы вообще стоит производить</strong>.</p></div>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#learning\" data-wiki=\"learning\">Можно ли отупеть от ChatGPT</a></li><li><a href=\"#ethics\" data-wiki=\"ethics\">Может ли технология быть этичной или неэтичной</a></li><li><a href=\"#errors-limits\" data-wiki=\"errors-limits\">Ошибки, «зубчатая граница» и иллюзия эффективности</a></li><li><a href=\"#work\" data-wiki=\"work\">Рынок труда: трансформация профессий и проблема новичков</a></li><li><a href=\"#discussion\" data-wiki=\"discussion\">Личный опыт и вопросы для дискуссионного клуба</a></li></ul></section>", "related": ["learning", "ethics", "errors-limits", "work", "discussion"]}, {"id": "discussion", "section": "Практика", "title": "Личный опыт и вопросы для дискуссионного клуба", "keywords": ["личный опыт", "дискуссионный клуб", "вопросы", "делегирование", "итоги"], "html": "\n<p class=\"lead\">Исследования не заменят личный опыт участников. А выдумывать этот опыт за них было бы довольно символичным способом провести дискуссию о галлюцинациях ИИ.</p>\n<h2>Пять вопросов для первого круга</h2>\n<ol>\n<li><strong>Какую конкретную задачу вы уже отдавали ИИ?</strong> Не «использую для работы», а «попросил найти ошибку в коде», «составить маршрут», «переписать письмо», «объяснить статью».</li>\n<li><strong>Что получилось измеримо лучше?</strong> Сэкономленные минуты, качество, появившаяся идея, снятый языковой барьер.</li>\n<li><strong>Когда ИИ последний раз ошибся, а вы это заметили?</strong> Этот вопрос обычно интереснее рассказов об успехах.</li>\n<li><strong>Какую вещь вы теперь делаете реже самостоятельно?</strong> Первый черновик, поиск, перевод, код, формулирование писем?</li>\n<li><strong>Что вы принципиально не готовы ему делегировать?</strong> И почему именно это?</li>\n</ol>\n<blockquote>Если завтра ваш AI-инструмент исчезнет на месяц, какую способность вы обнаружите у себя ослабевшей?</blockquote>\n<h2>Тезисы, вокруг которых получится настоящий спор</h2>\n<p><strong>Что такое ИИ?</strong> Не искусственный человек и не обязательно «разум», а семейство машинных систем, создающих прогнозы, содержание, рекомендации или решения.</p>\n<p><strong>Это очередная технологическая революция?</strong> Да, в том смысле, что она резко снижает стоимость определённого типа деятельности. Необычно то, что автоматизируются фрагменты интеллектуального и творческого труда.</p>\n<p><strong>ИИ повышает производительность?</strong> Да, иногда очень сильно. Но на соседней задаче способен замедлить или увеличить вероятность ошибки.</p>\n<p><strong>Можно ли от него отупеть?</strong> Нет доказательств, что ChatGPT просто «снижает интеллект». Есть риск ухудшения обучения, если ИИ выполняет именно ту работу, которую человеку нужно освоить самому.</p>\n<p><strong>Отнимет ли ИИ работу?</strong> Отдельные задачи — уже. Отдельные должности — будет менять или устранять. Но текущие данные лучше поддерживают широкую трансформацию профессий, чем простую картину тотальной замены.</p>\n<p><strong>Может ли ИИ быть неэтичным?</strong> Машина не несёт моральной ответственности как человек, но её разработка и применение могут быть этичными или неэтичными; цели, данные, распределение риска и контроль остаются человеческими решениями.</p>\n<p><strong>Боятся ли люди ИИ?</strong> Одновременно боятся и используют. Практическая выгода и спрос на регулирование спокойно сосуществуют.</p>\n<div class=\"callout key\"><strong>Финальный вопрос</strong><p>Если ИИ способен сделать нашу работу лучше сегодня, но уменьшить нашу способность выполнить её самостоятельно завтра, какой уровень зависимости мы считаем приемлемым?</p></div>\n<p>В этом сходятся почти все линии спора: производительность и обучение, рабочие места и квалификация, удобство и автономия, массовое принятие и общественная тревога. Это уже спор не о том, «хорошая ли технология». Это спор о том, <strong>каким человеком имеет смысл оставаться рядом с ней</strong>.</p>\n<section class=\"related\"><h2>См. также</h2><ul><li><a href=\"#home\" data-wiki=\"home\">Искусственный интеллект: что он нам даёт, что забирает и почему спор только начинается</a></li><li><a href=\"#learning\" data-wiki=\"learning\">Можно ли отупеть от ChatGPT</a></li><li><a href=\"#public-opinion\" data-wiki=\"public-opinion\">Как люди на самом деле относятся к ИИ</a></li><li><a href=\"#practice-future\" data-wiki=\"practice-future\">Чего разумно хотеть от ИИ и чего ждать дальше</a></li><li><a href=\"#ethics\" data-wiki=\"ethics\">Может ли технология быть этичной или неэтичной</a></li></ul></section>", "related": ["home", "learning", "public-opinion", "practice-future", "ethics"]}];
const byId = Object.fromEntries(pages.map(p=>[p.id,p]));
const content = document.getElementById('content');
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
const search = document.getElementById('search');
const results = document.getElementById('searchResults');
const mobileTitle = document.getElementById('mobileTitle');
let currentId = null;
const strip = (s)=>{const d=document.createElement('div');d.innerHTML=s;return (d.textContent||'').replace(/\s+/g,' ').trim()};
pages.forEach(p=>p._text=(p.title+' '+p.keywords.join(' ')+' '+strip(p.html)).toLowerCase());
function buildNav(){
 const sections=[...new Set(pages.map(p=>p.section))];
 const nav=document.getElementById('pageNav'); nav.innerHTML='';
 sections.forEach(sec=>{const wrap=document.createElement('section');wrap.className='nav-section';const h=document.createElement('h2');h.textContent=sec;wrap.appendChild(h);pages.filter(p=>p.section===sec).forEach(p=>{const a=document.createElement('a');a.href='#'+p.id;a.dataset.wiki=p.id;a.textContent=p.title;wrap.appendChild(a)});nav.appendChild(wrap)});
}
function prepareArticle(html){
 const host=document.createElement('div'); host.innerHTML=html;
 host.querySelectorAll('table').forEach(t=>{if(!t.parentElement.classList.contains('table-scroll')){const w=document.createElement('div');w.className='table-scroll';t.parentNode.insertBefore(w,t);w.appendChild(t)}});
 host.querySelectorAll('.process').forEach(t=>{const w=document.createElement('div');w.className='process-scroll';t.parentNode.insertBefore(w,t);w.appendChild(t)});
 return host.innerHTML;
}
function render(id,{replace=false}={}){
 let p=byId[id]; if(!p){p=byId.home;id='home';if(replace)history.replaceState(null,'','#home')}
 currentId=id; document.title=p.title+' — Wiki об ИИ'; mobileTitle.textContent=p.title;
 content.innerHTML=`<article class="article"><h1>${p.title}</h1><div class="meta">База знаний · данные исследования актуальны на 12 сентября 2026 года</div>${prepareArticle(p.html)}</article>`;
 document.querySelectorAll('[data-wiki]').forEach(a=>a.addEventListener('click',onWikiClick));
 document.querySelectorAll('#pageNav a').forEach(a=>a.classList.toggle('active',a.dataset.wiki===id));
 window.scrollTo(0,0); closeMenu();
}
function onWikiClick(e){const id=e.currentTarget.dataset.wiki;if(!byId[id])return;e.preventDefault();if(id===currentId){window.scrollTo(0,0);return}location.hash=id}
function route(){const id=decodeURIComponent(location.hash.replace(/^#/,''))||'home';if(!byId[id]){history.replaceState(null,'','#home');render('home');return}render(id)}
function openMenu(){sidebar.classList.add('open');backdrop.classList.add('show');document.body.classList.add('menu-open');document.getElementById('menuBtn').setAttribute('aria-expanded','true')}
function closeMenu(){sidebar.classList.remove('open');backdrop.classList.remove('show');document.body.classList.remove('menu-open');document.getElementById('menuBtn').setAttribute('aria-expanded','false')}
function doSearch(q){q=q.trim().toLowerCase();if(!q){results.classList.remove('show');results.innerHTML='';return}const terms=q.split(/\s+/).filter(Boolean);const scored=pages.map(p=>{let s=0;terms.forEach(t=>{if(p.title.toLowerCase().includes(t))s+=7;if(p.keywords.join(' ').toLowerCase().includes(t))s+=4;const c=p._text.split(t).length-1;s+=Math.min(c,6)});return[p,s]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8);results.innerHTML='';scored.forEach(([p])=>{const txt=strip(p.html);let pos=Math.min(...terms.map(t=>{const i=txt.toLowerCase().indexOf(t);return i<0?999999:i}));if(!isFinite(pos)||pos===999999)pos=0;const start=Math.max(0,pos-55);const sn=(start?'…':'')+txt.slice(start,start+170)+(txt.length>start+170?'…':'');const b=document.createElement('button');b.className='search-item';b.innerHTML=`<b>${p.title}</b><span>${sn}</span>`;b.addEventListener('click',()=>{results.classList.remove('show');search.value='';if(currentId!==p.id)location.hash=p.id;closeMenu()});results.appendChild(b)});if(!scored.length)results.innerHTML='<div class="search-item"><span>Ничего не найдено</span></div>';results.classList.add('show')}
buildNav();document.querySelectorAll('#pageNav a').forEach(a=>a.addEventListener('click',onWikiClick));
search.addEventListener('input',e=>doSearch(e.target.value));search.addEventListener('keydown',e=>{if(e.key==='Escape'){search.value='';doSearch('')}});
document.getElementById('menuBtn').addEventListener('click',()=>sidebar.classList.contains('open')?closeMenu():openMenu());
document.getElementById('closeMenu').addEventListener('click',closeMenu);backdrop.addEventListener('click',closeMenu);
document.getElementById('backBtn').addEventListener('click',()=>history.back());document.getElementById('forwardBtn').addEventListener('click',()=>history.forward());
document.getElementById('sideBack').addEventListener('click',()=>history.back());document.getElementById('sideForward').addEventListener('click',()=>history.forward());
window.addEventListener('hashchange',route);window.addEventListener('popstate',()=>setTimeout(route,0));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
if(!location.hash)history.replaceState(null,'','#home');route();
</script>
</body></html>
